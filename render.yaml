services:
  - type: web
    name: alivion-lead-flow
    env: node
    plan: free
    rootDir: lead-flow
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: alivion-leads-db
          property: connectionString

databases:
  - name: alivion-leads-db
    plan: free
